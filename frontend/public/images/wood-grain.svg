<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" preserveAspectRatio="none">
  <defs>
    <filter id="wood-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <!-- Vetas alargadas (baseFrequency Y >> X) = fibra de madera -->
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.015 0.18"
        numOctaves="4"
        seed="8"
        stitchTiles="stitch"
        result="noise"
      />
      <!-- Tinte caoba / roble rojizo -->
      <feColorMatrix
        in="noise"
        type="matrix"
        values="1 0 0 0 0.38
                0 0.55 0 0 0.10
                0 0 0.35 0 0.04
                0 0 0 0.55 0"
        result="colored"
      />
    </filter>
  </defs>
  <rect width="500" height="500" filter="url(#wood-grain)" />
</svg>
